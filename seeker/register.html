<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>注册 - 残疾人就业平台</title>
  <link rel="stylesheet" href="common.css">
  <style>
    .reg-header {
      padding: 52px 24px 24px;
      background: #fff;
      border-bottom: 1px solid var(--border);
    }
    .reg-title { font-size: 24px; font-weight: 800; color: var(--text); margin-bottom: 4px; }
    .reg-sub { font-size: 14px; color: var(--text-muted); }
    .step-container {
      padding: 16px;
      background: #fff;
      border-bottom: 1px solid var(--border);
    }
    .steps-row {
      display: flex;
      align-items: center;
      gap: 0;
    }
    .step-node {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }
    .step-circle {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      border: 2px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      font-weight: 700;
      background: #fff;
      color: var(--text-muted);
    }
    .step-circle.active { border-color: var(--primary); background: var(--primary); color: #fff; }
    .step-circle.done { border-color: var(--secondary); background: var(--secondary); color: #fff; }
    .step-name { font-size: 11px; color: var(--text-muted); }
    .step-name.active { color: var(--primary); font-weight: 600; }
    .step-line-bar {
      flex: 1;
      height: 2px;
      background: var(--border);
      margin-bottom: 18px;
    }
    .step-line-bar.done { background: var(--secondary); }
    .reg-form { padding: 24px; }
    .reg-section-title {
      font-size: 12px;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 16px;
    }
    .agree-row {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      margin-bottom: 20px;
      font-size: 13px;
      color: var(--text-muted);
    }
    .agree-row input { margin-top: 2px; flex-shrink: 0; width: 18px; height: 18px; }
    .agree-row a { color: var(--primary); text-decoration: none; }
    .sms-row { display: flex; gap: 10px; }
    .sms-input { flex: 1; }
    .sms-btn {
      height: 48px;
      padding: 0 14px;
      background: var(--primary-light);
      color: var(--primary);
      border: none;
      border-radius: var(--radius-sm);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .strength-bar {
      display: flex;
      gap: 4px;
      margin-top: 8px;
    }
    .strength-seg {
      height: 4px;
      flex: 1;
      border-radius: 2px;
      background: var(--border);
    }
    .strength-seg.weak { background: var(--error); }
    .strength-seg.medium { background: var(--warning); }
    .strength-seg.strong { background: var(--secondary); }
    .strength-label { font-size: 12px; color: var(--text-muted); margin-top: 4px; }
    .login-link {
      text-align: center;
      margin-top: 16px;
      font-size: 14px;
      color: var(--text-muted);
    }
    .login-link a { color: var(--primary); font-weight: 600; text-decoration: none; }
  </style>
</head>
<body>
  <div class="page-no-nav">
    <div class="a11y-bar">
      <button class="a11y-btn" onclick="document.body.classList.toggle('high-contrast')">🔆 对比度</button>
    </div>

    <!-- 头部 -->
    <div class="reg-header">
      <a href="splash.html" style="display:inline-flex;align-items:center;gap:6px;color:var(--text-muted);text-decoration:none;font-size:14px;margin-bottom:12px;">← 返回</a>
      <div class="reg-title">创建账号</div>
      <div class="reg-sub">加入平台，开启就业之旅</div>
    </div>

    <!-- 步骤条 -->
    <div class="step-container">
      <div class="steps-row">
        <div class="step-node">
          <div class="step-circle active">1</div>
          <div class="step-name active">基本信息</div>
        </div>
        <div class="step-line-bar"></div>
        <div class="step-node">
          <div class="step-circle">2</div>
          <div class="step-name">实名认证</div>
        </div>
        <div class="step-line-bar"></div>
        <div class="step-node">
          <div class="step-circle">3</div>
          <div class="step-name">完善简历</div>
        </div>
      </div>
    </div>

    <!-- 表单 -->
    <div class="reg-form">
      <div class="reg-section-title">账号信息</div>

      <div class="input-group">
        <label class="input-label">手机号<span class="required">*</span></label>
        <div class="sms-row">
          <input class="input-field sms-input" type="tel" placeholder="请输入手机号" maxlength="11" id="phone">
          <button class="sms-btn" onclick="sendSms(this)">发送验证码</button>
        </div>
      </div>

      <div class="input-group">
        <label class="input-label">短信验证码<span class="required">*</span></label>
        <input class="input-field" type="number" placeholder="请输入6位验证码" maxlength="6">
      </div>

      <div class="input-group">
        <label class="input-label">设置密码<span class="required">*</span></label>
        <input class="input-field" type="password" placeholder="请设置密码（6-20位）" id="pwd-set"
          oninput="checkStrength(this.value)">
        <div class="strength-bar">
          <div class="strength-seg" id="s1"></div>
          <div class="strength-seg" id="s2"></div>
          <div class="strength-seg" id="s3"></div>
        </div>
        <div class="strength-label" id="strength-text">密码强度：待输入</div>
      </div>

      <div class="input-group">
        <label class="input-label">确认密码<span class="required">*</span></label>
        <input class="input-field" type="password" placeholder="请再次输入密码">
      </div>

      <div class="agree-row">
        <input type="checkbox" id="agree" checked aria-label="同意服务协议和隐私政策">
        <label for="agree">
          我已阅读并同意
          <a href="#">《用户服务协议》</a>
          和
          <a href="#">《隐私政策》</a>
          ，本平台将依法保护您的个人信息
        </label>
      </div>

      <a href="verify.html" class="btn btn-primary" role="button">下一步 · 实名认证</a>

      <div class="login-link">
        已有账号？<a href="login.html">去登录</a>
      </div>

      <!-- 提示信息 -->
      <div style="margin-top:24px;padding:12px 14px;background:var(--secondary-light);border-radius:var(--radius-sm);">
        <div style="font-size:13px;color:var(--secondary);font-weight:600;margin-bottom:4px;">🔒 信息安全提示</div>
        <div style="font-size:12px;color:var(--text-muted);line-height:1.6;">
          您的个人信息将严格保密，仅用于平台就业服务。
          实名信息经腾讯云认证，本平台不留存原始证件照片。
        </div>
      </div>
    </div>
  </div>

  <script>
    let countdown = 0;
    function sendSms(btn) {
      const phone = document.getElementById('phone').value;
      if (phone.length !== 11) { alert('请输入正确的手机号'); return; }
      if (countdown > 0) return;
      countdown = 60;
      btn.disabled = true;
      const timer = setInterval(() => {
        countdown--;
        btn.textContent = countdown + 's后重发';
        if (countdown <= 0) {
          clearInterval(timer);
          btn.textContent = '发送验证码';
          btn.disabled = false;
        }
      }, 1000);
    }
    function checkStrength(val) {
      const s1 = document.getElementById('s1');
      const s2 = document.getElementById('s2');
      const s3 = document.getElementById('s3');
      const txt = document.getElementById('strength-text');
      s1.className = s2.className = s3.className = 'strength-seg';
      if (!val) { txt.textContent = '密码强度：待输入'; return; }
      let score = 0;
      if (val.length >= 6) score++;
      if (/[A-Z]/.test(val) || /[a-z]/.test(val)) score++;
      if (/[0-9]/.test(val) && /[^a-zA-Z0-9]/.test(val)) score++;
      if (score === 1) {
        s1.classList.add('weak');
        txt.textContent = '密码强度：弱';
        txt.style.color = 'var(--error)';
      } else if (score === 2) {
        s1.classList.add('medium'); s2.classList.add('medium');
        txt.textContent = '密码强度：中';
        txt.style.color = 'var(--warning)';
      } else {
        s1.classList.add('strong'); s2.classList.add('strong'); s3.classList.add('strong');
        txt.textContent = '密码强度：强';
        txt.style.color = 'var(--secondary)';
      }
    }
  </script>
</body>
</html>
