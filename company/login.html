<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>企业登录</title>
  <link rel="stylesheet" href="common.css">
  <style>
    .login-header {
      padding: 52px 24px 28px;
      background: linear-gradient(180deg, #F0FDFA 0%, #F8FAFC 100%);
    }
    .brand-icon {
      width: 60px; height: 60px; border-radius: 16px;
      background: linear-gradient(135deg, #0D9488, #0F766E);
      display: flex; align-items: center; justify-content: center;
      font-size: 30px; margin-bottom: 14px;
      box-shadow: 0 4px 14px rgba(13,148,136,0.3);
    }
    .login-title { font-size: 24px; font-weight: 800; color: var(--text); margin-bottom: 4px; }
    .login-sub { font-size: 14px; color: var(--text-muted); }
    .login-form { padding: 24px; }
    .tab-switch {
      display: flex; background: var(--bg); border-radius: var(--radius-sm);
      padding: 3px; margin-bottom: 22px;
    }
    .tab-btn {
      flex: 1; height: 34px; border: none; border-radius: 6px;
      font-size: 14px; font-weight: 500; cursor: pointer;
      background: transparent; color: var(--text-muted); transition: all 0.2s;
    }
    .tab-btn.active {
      background: #fff; color: var(--primary);
      font-weight: 700; box-shadow: 0 1px 4px rgba(0,0,0,0.1);
    }
    .sms-row { display: flex; gap: 8px; }
    .sms-input { flex: 1; }
    .sms-btn {
      height: 46px; padding: 0 14px; background: var(--primary-light);
      color: var(--primary); border: none; border-radius: var(--radius-sm);
      font-size: 13px; font-weight: 600; cursor: pointer; white-space: nowrap; flex-shrink: 0;
    }
    .forgot { text-align: right; font-size: 13px; color: var(--primary); margin-top: -8px; margin-bottom: 16px; display: block; cursor: pointer; }
    .divider-text {
      display: flex; align-items: center; gap: 12px;
      margin: 20px 0; color: var(--text-muted); font-size: 13px;
    }
    .divider-text::before, .divider-text::after { content: ''; flex: 1; height: 1px; background: var(--border); }
    .register-link { text-align: center; margin-top: 16px; font-size: 14px; color: var(--text-muted); }
    .register-link a { color: var(--primary); font-weight: 600; text-decoration: none; }
    .switch-portal {
      margin: 16px 24px;
      padding: 12px 14px;
      background: var(--bg); border-radius: var(--radius-sm);
      display: flex; align-items: center; justify-content: space-between;
      font-size: 13px; color: var(--text-muted);
    }
    .switch-portal a { color: var(--accent); font-weight: 600; text-decoration: none; }
    .pwd-wrap { position: relative; }
    .eye-btn {
      position: absolute; right: 13px; top: 50%; transform: translateY(-50%);
      font-size: 18px; cursor: pointer; color: var(--text-muted);
      background: none; border: none;
    }
  </style>
</head>
<body>
  <div class="page-no-nav">
    <div class="login-header">
      <div class="brand-icon">🏢</div>
      <div class="login-title">企业招聘端</div>
      <div class="login-sub">【平台全称待定】· 企业专属入口</div>
    </div>

    <div class="login-form">
      <div class="tab-switch">
        <button class="tab-btn active" id="tab-pwd" onclick="switchTab('pwd')">密码登录</button>
        <button class="tab-btn" id="tab-sms" onclick="switchTab('sms')">短信登录</button>
      </div>

      <div id="form-pwd">
        <div class="input-group">
          <label class="input-label">手机号<span class="req">*</span></label>
          <input class="input-field" type="tel" placeholder="请输入注册手机号" maxlength="11">
        </div>
        <div class="input-group">
          <label class="input-label">密码<span class="req">*</span></label>
          <div class="pwd-wrap">
            <input class="input-field" type="password" placeholder="请输入密码" id="pwd-input">
            <button class="eye-btn" onclick="togglePwd()">👁️</button>
          </div>
        </div>
        <span class="forgot">忘记密码？</span>
        <a href="home.html" class="btn btn-primary">登 录</a>
      </div>

      <div id="form-sms" style="display:none;">
        <div class="input-group">
          <label class="input-label">手机号<span class="req">*</span></label>
          <div class="sms-row">
            <input class="input-field sms-input" type="tel" placeholder="请输入手机号" maxlength="11">
            <button class="sms-btn" onclick="sendSms(this)">发送验证码</button>
          </div>
        </div>
        <div class="input-group">
          <label class="input-label">验证码<span class="req">*</span></label>
          <input class="input-field" type="number" placeholder="请输入6位验证码" maxlength="6">
        </div>
        <a href="home.html" class="btn btn-primary">登 录</a>
      </div>

      <div class="register-link">还没有账号？<a href="register.html">立即注册企业账号</a></div>
    </div>

    <div class="switch-portal">
      <span>您是求职者？</span>
      <a href="../seeker/login.html">切换到求职端 →</a>
    </div>
  </div>
  <script>
    function switchTab(t) {
      document.getElementById('tab-pwd').classList.toggle('active', t === 'pwd');
      document.getElementById('tab-sms').classList.toggle('active', t === 'sms');
      document.getElementById('form-pwd').style.display = t === 'pwd' ? 'block' : 'none';
      document.getElementById('form-sms').style.display = t === 'sms' ? 'block' : 'none';
    }
    function togglePwd() {
      const i = document.getElementById('pwd-input');
      i.type = i.type === 'password' ? 'text' : 'password';
    }
    let cd = 0;
    function sendSms(btn) {
      if (cd > 0) return;
      cd = 60; btn.disabled = true;
      const t = setInterval(() => { cd--; btn.textContent = cd + 's后重发'; if (!cd) { clearInterval(t); btn.textContent = '发送验证码'; btn.disabled = false; } }, 1000);
    }
  </script>
</body>
</html>
